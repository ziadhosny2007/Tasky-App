name: tasky
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  icons_launcher: ^3.1.0
  smooth_page_indicator: ^3.0.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  sqflite: ^2.4.2+1
  animate_do: ^5.1.0
  shared_preferences: ^2.5.6
  go_router: ^17.5.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

# App Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#2A1B6B"
  adaptive_icon_foreground: "assets/icons/app_icon_logo.png"

  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_intl:
  enabled: true
